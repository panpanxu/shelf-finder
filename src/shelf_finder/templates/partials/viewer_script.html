<script>
  // 量出布局距页面顶部的距离，供样式算出视口里剩余的高度；窗口大小变了重新量
  const layout = document.getElementById("layout");
  function measureLayoutTop() {
    layout.style.setProperty("--layout-top", `${layout.getBoundingClientRect().top + window.scrollY}px`);
  }
  measureLayoutTop();
  window.addEventListener("resize", measureLayoutTop);

  const viewer = document.getElementById("viewer");
  const photoImg = viewer.querySelector("img");
  const NATURAL = { w: {{ photo.width }}, h: {{ photo.height }} };

  // 点框或点列表项，两边同时高亮同一本书
  function activate(id, scroll) {
    document.querySelectorAll(".active").forEach((el) => el.classList.remove("active"));
    document.querySelectorAll(`[data-id="${id}"]`).forEach((el) => el.classList.add("active"));
    if (scroll) document.getElementById(`spine-${id}`).scrollIntoView({ block: "nearest" });
  }
  document.querySelectorAll("rect[data-id]").forEach((el) => el.addEventListener("click", () => activate(el.dataset.id, true)));
  document.querySelectorAll("#spines li[data-id]").forEach((el) => el.addEventListener("click", (event) => {
    if (event.target.closest(".tools, .douban, .tag")) return;
    activate(el.dataset.id, false);
  }));
  const target = location.hash.match(/^#spine-(\d+)$/);
  if (target) activate(target[1], true);

  // 放大镜：鼠标在照片上移动，取景框跟着鼠标走，照片右侧的面板按原始分辨率（1 个存储像素对应 1 个屏幕像素）
  // 显示取景框里的那一块。面板和显示出来的照片一样大，取景框的大小就是面板在照片上对应的范围。
  const svgOverlay = viewer.querySelector("svg");
  const lens = document.createElement("div");
  lens.className = "lens";
  lens.hidden = true;
  const panel = document.createElement("div");
  panel.className = "zoom-panel";
  panel.hidden = true;
  panel.style.backgroundImage = `url("${photoImg.getAttribute("src")}")`;
  viewer.append(lens, panel);

  function moveLens(event) {
    const shown = { w: photoImg.clientWidth, h: photoImg.clientHeight };
    // 每个屏幕像素对应多少个原图像素
    const scale = NATURAL.w / shown.w;
    // 面板尽量和照片一样大，右边放不下就按剩下的空间缩
    const room = document.documentElement.clientWidth - viewer.getBoundingClientRect().right - 24;
    const panelW = Math.max(120, Math.min(shown.w, room));
    const panelH = shown.h;
    // 取景框在屏幕上的尺寸：面板尺寸换算回照片上
    const lensW = Math.min(shown.w, panelW / scale), lensH = Math.min(shown.h, panelH / scale);
    const r = svgOverlay.getBoundingClientRect();
    const cx = event.clientX - r.left, cy = event.clientY - r.top;
    const lx = Math.min(Math.max(cx - lensW / 2, 0), shown.w - lensW);
    const ly = Math.min(Math.max(cy - lensH / 2, 0), shown.h - lensH);
    lens.style.left = `${lx}px`;
    lens.style.top = `${ly}px`;
    lens.style.width = `${lensW}px`;
    lens.style.height = `${lensH}px`;
    panel.style.width = `${panelW}px`;
    panel.style.height = `${panelH}px`;
    panel.style.backgroundSize = `${NATURAL.w}px ${NATURAL.h}px`;
    panel.style.backgroundPosition = `${-lx * scale}px ${-ly * scale}px`;
    lens.hidden = false;
    panel.hidden = false;
  }
  function hideLens() {
    lens.hidden = true;
    panel.hidden = true;
  }
  svgOverlay.addEventListener("pointermove", (event) => {
    // 触屏没有悬停；画框模式下照片上的拖动另有用途
    if (event.pointerType === "touch" || viewer.classList.contains("drawing")) return hideLens();
    moveLens(event);
  });
  svgOverlay.addEventListener("pointerleave", hideLens);
</script>
