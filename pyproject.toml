[project]
name = "shelf-finder"
version = "0.1.0"
description = "把书架拍成照片，输入关键字就能在照片上框出那本书"
readme = "README.md"
authors = [
    { name = "xuyi", email = "xuyi@hytto.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "numpy<2.4",
    "openai>=3.24.0",
    "opencc>=1.4.2",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "python-multipart>=0.0.32",
    "regex>=2026.9.29",
    "uvicorn>=0.54.0",
]

[project.scripts]
shelf-finder = "shelf_finder:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
# 上传和识别需要本机 OCR。开发机默认装；只查看已有数据的部署（比如 NAS 上的镜像）用 --no-default-groups 跳过
recognition = [
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
]

[tool.uv]
default-groups = ["dev", "recognition"]
